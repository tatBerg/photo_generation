[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "photo-generation-bot"
version = "0.1.0"
description = "Telegram AI photo generation bot with OpenAI and fal.ai providers"
requires-python = ">=3.11"
dependencies = [
  "aiogram>=3.20,<4",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "redis>=5.2,<6",
  "openai>=1.66,<2",
  "fal-client>=0.7,<1",
  "pillow>=11,<12",
  "python-multipart>=0.0.20,<1",
  "boto3>=1.35,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/photo_generation"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
